  <body>
    <main id="demo">
      <noscript>
        <h1>Bassalt</h1>
        <p>
          An FFGL effect that turns the frame into a lava lamp, and the lamp is
          a working heat engine. A bulb warms wax that's denser than the water
          when it's cold and lighter when it's hot, so it rises, cools at the
          cap and sinks again. Bass drives the bulb and salt sets the water. The
          pillars that neck and pinch off, and the stalls, come out of the
          physics rather than being animated.
        </p>
        <p>
          This demo runs the plugin's shaders in your browser, so it needs
          JavaScript and WebGL2. The plugin itself, its source and its downloads
          are on
          <a href="https://github.com/stoatworks-labs/bassalt">its repository</a>.
        </p>
        <ul>
          <li><a href="https://stoatworks-labs.com/software/bassalt/">Project page and downloads</a></li>
